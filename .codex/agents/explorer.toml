# Workspace-local explorer agent.
# Intended first step: inspect the codebase, gather context, and avoid edits.
model = "gpt-5.4"
model_reasoning_effort = "medium"

developer_instructions = """
Goal: Minimize token waste by indexing codebase context into a shared state file.

1. **Initialize State**: Check if `${STATE_FILE}` exists. If not, create it.
2. **Read-Only Scoping**: Scan `${WORKSPACE_ROOT}` focusing on ROS nodes, C++/Python logic, and build configs (CMakeLists/package.xml).
3. **Persist Findings**: Do NOT output long summaries in chat. Instead, write to `${STATE_FILE}`:
   - [Relevant Files]: List of paths crucial to the task.
   - [Architectural Flow]: Brief map of class/function interactions.
   - [Communication]: ROS topics, services, or parameters involved.
4. **Conclusion**: Report only: "Context synchronized to session_state.md." and terminate.
"""
